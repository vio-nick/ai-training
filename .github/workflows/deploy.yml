name: 部署 GSTRIDE

on:
  workflow_dispatch:
    inputs:
      initialize_model:
        description: 首次部署时生成固定模型发布包（已有模型时会拒绝覆盖）
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gstride-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 检查前端构建
        working-directory: frontend
        run: |
          npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
          npm run build
      - name: 检查部署文件
        run: |
          bash -n deploy/remote_deploy.sh
          DEPLOY_SHA=0123456789abcdef0123456789abcdef01234567 \
            MODEL_RELEASE_DIR=/tmp/gstride-model \
            docker compose -p gstride-check -f deploy/compose.yml config --quiet
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: 检查 API 与模型发布
        run: |
          python -m pip install -e '.[api,dev]'
          python -m unittest discover -s tests -p test_api.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      WEB_PORT: ${{ vars.WEB_PORT || '8080' }}
      INITIALIZE_MODEL: ${{ inputs.initialize_model }}
    steps:
      - uses: actions/checkout@v7
      - name: 检查部署配置并准备 SSH
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "缺少 GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo 'DEPLOY_PORT 必须是数字' >&2; exit 1; }
          [[ "$WEB_PORT" =~ ^[0-9]+$ ]] || { echo 'WEB_PORT 必须是数字' >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: 打包已提交的部署文件
        shell: bash
        run: |
          set -euo pipefail
          git archive HEAD \
            .dockerignore pyproject.toml api src frontend deploy \
            scripts/release_gstride_fall_model.py configs/gstride_fall_v1.json \
            data/public/gstride_v1/processed/feature_table_gstride_fall_v1.csv \
            data/public/gstride_v1/processed/split_gstride_fall_v1.csv \
            | gzip > "$RUNNER_TEMP/gstride-${GITHUB_SHA}.tar.gz"
      - name: 传送并部署
        shell: bash
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$target" 'mkdir -p ~/gstride/incoming'
          scp -P "$DEPLOY_PORT" -o BatchMode=yes \
            "$RUNNER_TEMP/gstride-${GITHUB_SHA}.tar.gz" \
            "$target:gstride/incoming/${GITHUB_SHA}.tar.gz"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$target" \
            bash -s -- "$GITHUB_SHA" "$INITIALIZE_MODEL" "$WEB_PORT" \
            < deploy/remote_deploy.sh
